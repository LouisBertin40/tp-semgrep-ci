name: DevSecOps - TruffleHog Secret Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  trufflehog:
    name: Scan Verified Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # historique complet : nécessaire pour atteindre le commit "base"

      - name: TruffleHog OSS Scan
        uses: trufflesecurity/trufflehog@d232362a64a09a9e7d58267b8f5acef00ae90e23 # v3.100.0
        with:
          version: 3.100.0 # épingle aussi l'image Docker (sinon "latest")
          # L'action ajoute déjà --fail : le remettre ici fait planter le scan
          # ("flag 'fail' cannot be repeated").
          # Plage scannée : before..after sur un push, base..head sur une PR.
          extra_args: --only-verified
